<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" class="stage-all" data-stage-seconds="6" data-vl-camera-1="0 0 800 560" data-vl-camera-2="70 92 660 462" data-vl-camera-3="100 224 480 336" data-vl-camera-try="100 224 480 336" data-vl-try='{"controls":[{"id":"carbs","label":"Carbohydrate","min":0,"max":100,"step":5,"value":40,"unit":"g"},{"id":"fat","label":"Fat","min":0,"max":50,"step":1,"value":10,"unit":"g"}],"rules":[{"when":{"fat":[null,4]},"say":"Low in fat: almost all of this energy comes from carbohydrate, at about 17 kJ per gram.","mood":"happy","tone":"ok"},{"when":{"fat":[5,19]},"say":"Each gram of fat adds about 37 kJ, so a little fat adds a lot of energy.","mood":"thinking","tone":"ok"},{"when":{"fat":[20,null]},"say":"Fat-heavy: every 10 g of fat adds about 370 kJ, as much as 22 g of carbohydrate.","mood":"wow","tone":"warn"}]}'>
<title id="t">The three macronutrients</title>
<desc id="d">Carbohydrate, protein and fat appear with their jobs in the body, then bars compare their energy: about 17 kJ per gram for carbohydrate and protein and about 37 kJ per gram for fat.</desc>
<defs>
