<radialGradient id="crumb" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fde68a"/></radialGradient>
<radialGradient id="meat" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/></radialGradient>
<radialGradient id="skin" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#166534"/></radialGradient>
<radialGradient id="flesh" cx=".4" cy=".35" r=".9"><stop offset="0" stop-color="#f7fee7"/><stop offset="1" stop-color="#bef264"/></radialGradient>
<radialGradient id="pit" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#78350f"/></radialGradient>
